<section
  class="overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-sm shadow-slate-950/5 dark:border-slate-800 dark:bg-slate-900"
>
  @if (title() || description()) {
    <header
      class="flex flex-col gap-1 border-b border-slate-200/80 px-5 py-4 dark:border-slate-800 sm:flex-row sm:items-end sm:justify-between"
    >
      <div>
        @if (title()) {
          <h2 class="text-base font-bold text-slate-950 dark:text-white">{{ title() }}</h2>
        }
        @if (description()) {
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ description() }}</p>
        }
      </div>
      <ng-content select="[driveOsListHeaderActions]" />
    </header>
  }

  <div
    [class.p-4]="!flush()"
    [class.sm:p-5]="!flush()"
  >
    <ng-content />
  </div>

  <ng-content select="[driveOsListFooter]" />
</section>
