<section
      aria-label="Notifications"
      aria-live="polite"
      class="
        pointer-events-none
        fixed right-4 top-4 z-[1000]
        flex w-[calc(100%-2rem)]
        max-w-sm flex-col gap-3
      "
    >
      @for (
        toast of toastService.toasts();
        track toast.id
      ) {
        <article
          class="
            pointer-events-auto
            flex gap-3
            rounded-xl border
            bg-white p-4
            shadow-lg
            dark:bg-slate-900
          "
          [class]="containerClasses(toast.variant)"
          role="status"
        >
          <div
            class="
              mt-0.5 flex size-9
              shrink-0 items-center
              justify-center rounded-full
            "
            [class]="iconContainerClasses(
              toast.variant
            )"
          >
            <i
              [class]="iconClass(toast.variant)"
              aria-hidden="true"
            ></i>
          </div>

          <div class="min-w-0 flex-1">
            <h2
              class="
                text-sm font-semibold
                text-slate-900
                dark:text-slate-100
              "
            >
              {{ toast.title }}
            </h2>

            @if (toast.message) {
              <p
                class="
                  mt-1 text-sm
                  text-slate-600
                  dark:text-slate-300
                "
              >
                {{ toast.message }}
              </p>
            }
          </div>

          <button
            type="button"
            class="
              flex size-8 shrink-0
              items-center justify-center
              rounded-lg text-slate-400
              transition-colors
              hover:bg-slate-100
              hover:text-slate-700
              focus-visible:outline-none
              focus-visible:ring-2
              focus-visible:ring-blue-700
              dark:hover:bg-slate-800
              dark:hover:text-slate-200
            "
            aria-label="Fermer la notification"
            (click)="
              toastService.dismiss(toast.id)
            "
          >
            <i
              class="ph ph-x"
              aria-hidden="true"
            ></i>
          </button>
        </article>
      }
    </section>
