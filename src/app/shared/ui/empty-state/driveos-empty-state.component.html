<div
      class="
        flex min-h-64
        flex-col items-center
        justify-center
        px-6 py-10
        text-center
      "
    >
      <div
        class="
          flex size-16
          items-center justify-center
          rounded-2xl
          bg-orange-50
          text-orange-600
          dark:bg-orange-950
          dark:text-orange-300
        "
      >
        <i
          [class]="icon()"
          class="text-3xl"
          aria-hidden="true"
        ></i>
      </div>

      <h2
        class="
          mt-5
          text-lg font-semibold
          text-slate-900
          dark:text-slate-100
        "
      >
        {{ title() }}
      </h2>

      <p
        class="
          mt-2 max-w-md
          text-sm text-slate-500
          dark:text-slate-400
        "
      >
        {{ description() }}
      </p>

      <div class="mt-5">
        <ng-content />
      </div>
    </div>
