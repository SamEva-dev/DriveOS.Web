<div
  class="flex flex-col items-center justify-center px-6 text-center"
  [class.min-h-64]="!compact()"
  [class.py-10]="!compact()"
  [class.py-7]="compact()"
>
  <div
    class="relative flex size-16 items-center justify-center rounded-2xl ring-8 ring-slate-50 dark:ring-slate-950/50"
    [class.bg-orange-50]="tone() === 'default'"
    [class.text-orange-600]="tone() === 'default'"
    [class.dark:bg-orange-950]="tone() === 'default'"
    [class.bg-blue-50]="tone() === 'search'"
    [class.text-blue-700]="tone() === 'search'"
    [class.dark:bg-blue-950]="tone() === 'search'"
    [class.bg-emerald-50]="tone() === 'success'"
    [class.text-emerald-700]="tone() === 'success'"
    [class.dark:bg-emerald-950]="tone() === 'success'"
  >
    <drive-os-icon [name]="icon()" size="xl" />
  </div>

  <h2 class="mt-6 text-lg font-bold tracking-tight text-slate-950 dark:text-white">{{ title() }}</h2>
  <p class="mt-2 max-w-lg text-sm leading-6 text-slate-500 dark:text-slate-400">{{ description() }}</p>
  <div class="mt-6 flex flex-wrap items-center justify-center gap-2"><ng-content /></div>
</div>
