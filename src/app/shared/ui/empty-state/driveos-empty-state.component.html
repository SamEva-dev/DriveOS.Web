<div class="flex min-h-64 flex-col items-center justify-center px-6 py-10 text-center">
  <div class="flex size-16 items-center justify-center rounded-2xl bg-[var(--driveos-accent-50)] text-[var(--driveos-accent-600)] driveos-dark:bg-orange-950">
    <drive-os-icon [name]="icon()" size="xl" />
  </div>
  <h2 class="mt-5 text-lg font-semibold text-[var(--driveos-text-primary)]">{{ title() }}</h2>
  <p class="mt-2 max-w-md text-sm leading-6 text-[var(--driveos-text-secondary)]">{{ description() }}</p>
  <div class="mt-5"><ng-content /></div>
</div>
