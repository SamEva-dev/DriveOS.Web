<div class="flex flex-col gap-4 border-t border-slate-200/80 bg-slate-50/60 px-4 py-4 dark:border-slate-800 dark:bg-slate-950/30 sm:flex-row sm:items-center sm:justify-between sm:px-5">
  <div class="flex items-center gap-3">
    <div class="hidden size-9 items-center justify-center rounded-xl bg-white text-slate-500 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-400 dark:ring-slate-700 sm:flex">
      <i class="ph ph-list-numbers" aria-hidden="true"></i>
    </div>
    <p class="text-sm text-slate-500 dark:text-slate-400">
      {{
        'pagination.report'
          | translate
            : { first: firstItem(), last: lastItem(), total: totalCount() }
      }}
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <label for="driveosPageSize" class="text-xs font-semibold uppercase tracking-wide text-slate-400">
      {{ 'pagination.pageSize' | translate }}
    </label>

    <select
      id="driveosPageSize"
      class="driveos-select h-9 min-w-20 rounded-xl py-0"
      [ngModel]="pageSize()"
      [disabled]="disabled()"
      (ngModelChange)="changePageSize($event)"
    >
      @for (option of pageSizeOptions(); track option) {
        <option [ngValue]="option">{{ option }}</option>
      }
    </select>

    <div class="ml-1 flex items-center gap-1 rounded-2xl border border-slate-200 bg-white p-1 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <drive-os-button variant="ghost" size="sm" icon="chevrons-left" [ariaLabel]="'pagination.firstPage' | translate" [disabled]="pageNumber() <= 1 || disabled()" (pressed)="goToFirstPage()" />
      <drive-os-button variant="ghost" size="sm" icon="chevron-left" [ariaLabel]="'pagination.previousPage' | translate" [disabled]="pageNumber() <= 1 || disabled()" (pressed)="goToPreviousPage()" />

      <div class="min-w-24 px-2 text-center text-sm font-bold text-slate-800 dark:text-slate-100">
        {{ 'pagination.page' | translate : { current: normalizedPageNumber(), total: normalizedTotalPages() } }}
      </div>

      <drive-os-button variant="ghost" size="sm" icon="chevron-right" [ariaLabel]="'pagination.nextPage' | translate" [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()" (pressed)="goToNextPage()" />
      <drive-os-button variant="ghost" size="sm" icon="chevrons-right" [ariaLabel]="'pagination.lastPage' | translate" [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()" (pressed)="goToLastPage()" />
    </div>
  </div>
</div>
