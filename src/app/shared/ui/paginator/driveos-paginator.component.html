<div
  class="flex flex-col gap-4 border-t border-[var(--driveos-border)] px-4 py-4 sm:flex-row sm:items-center sm:justify-between dark:border-slate-800"
>
  <p class="text-sm text-[var(--driveos-text-secondary)]">
    {{
      'pagination.report'
        | translate
          : {
              first: firstItem(),
              last: lastItem(),
              total: totalCount(),
            }
    }}
  </p>

  <div class="flex flex-wrap items-center gap-2">
    <label
      for="driveosPageSize"
      class="text-sm text-[var(--driveos-text-secondary)]"
    >
      {{ 'pagination.pageSize' | translate }}
    </label>

    <select
      id="driveosPageSize"
      class="driveos-select h-9 min-w-20 py-0"
      [ngModel]="pageSize()"
      (ngModelChange)="changePageSize($event)"
    >
      @for (option of pageSizeOptions(); track option) {
        <option [ngValue]="option">
          {{ option }}
        </option>
      }
    </select>

    <div class="ml-1 flex items-center gap-1">
      <drive-os-button
        variant="ghost"
        size="sm"
        icon="chevrons-left"
        [ariaLabel]="'pagination.firstPage' | translate"
        [disabled]="pageNumber() <= 1 || disabled()"
        (pressed)="goToFirstPage()"
      />

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="chevron-left"
        [ariaLabel]="'pagination.previousPage' | translate"
        [disabled]="pageNumber() <= 1 || disabled()"
        (pressed)="goToPreviousPage()"
      />

      <div class="min-w-24 text-center text-sm font-medium text-[var(--driveos-text-primary)]">
        {{
          'pagination.page'
            | translate
              : {
                  current: normalizedPageNumber(),
                  total: normalizedTotalPages(),
                }
        }}
      </div>

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="chevron-right"
        [ariaLabel]="'pagination.nextPage' | translate"
        [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()"
        (pressed)="goToNextPage()"
      />

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="chevrons-right"
        [ariaLabel]="'pagination.lastPage' | translate"
        [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()"
        (pressed)="goToLastPage()"
      />
    </div>
  </div>
</div>
