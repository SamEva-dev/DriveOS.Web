<div
  class="flex flex-col gap-4 border-t border-slate-200 px-4 py-4 sm:flex-row sm:items-center sm:justify-between dark:border-slate-800"
>
  <p class="text-sm text-slate-500 dark:text-slate-400">
    {{
      'pagination.report'
        | translate
          : {
              first: firstItem(),
              last: lastItem(),
              total: totalCount(),
            }
    }}
  </p>

  <div class="flex flex-wrap items-center gap-2">
    <label
      for="driveosPageSize"
      class="text-sm text-slate-600 dark:text-slate-300"
    >
      {{ 'pagination.pageSize' | translate }}
    </label>

    <select
      id="driveosPageSize"
      class="h-9 rounded-lg border border-slate-300 bg-white px-2 text-sm text-slate-800 outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-700/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
      [ngModel]="pageSize()"
      (ngModelChange)="changePageSize($event)"
    >
      @for (option of pageSizeOptions(); track option) {
        <option [ngValue]="option">
          {{ option }}
        </option>
      }
    </select>

    <div class="ml-1 flex items-center gap-1">
      <drive-os-button
        variant="ghost"
        size="sm"
        icon="ph ph-caret-double-left"
        [ariaLabel]="'pagination.firstPage' | translate"
        [disabled]="pageNumber() <= 1 || disabled()"
        (pressed)="goToFirstPage()"
      />

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="ph ph-caret-left"
        [ariaLabel]="'pagination.previousPage' | translate"
        [disabled]="pageNumber() <= 1 || disabled()"
        (pressed)="goToPreviousPage()"
      />

      <div class="min-w-24 text-center text-sm font-medium text-slate-700 dark:text-slate-200">
        {{
          'pagination.page'
            | translate
              : {
                  current: normalizedPageNumber(),
                  total: normalizedTotalPages(),
                }
        }}
      </div>

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="ph ph-caret-right"
        [ariaLabel]="'pagination.nextPage' | translate"
        [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()"
        (pressed)="goToNextPage()"
      />

      <drive-os-button
        variant="ghost"
        size="sm"
        icon="ph ph-caret-double-right"
        [ariaLabel]="'pagination.lastPage' | translate"
        [disabled]="pageNumber() >= totalPages() || totalPages() === 0 || disabled()"
        (pressed)="goToLastPage()"
      />
    </div>
  </div>
</div>
