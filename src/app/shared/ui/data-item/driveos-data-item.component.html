<div class="min-w-0 rounded-2xl border border-slate-100 bg-slate-50/70 px-4 py-3 dark:border-slate-800 dark:bg-slate-900/60">
  <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ label() }}</dt>
  <dd class="mt-1 break-words text-sm font-semibold text-slate-950 dark:text-slate-100" [class.font-mono]="mono()">
    {{ value() ?? fallback() }}
  </dd>
</div>
