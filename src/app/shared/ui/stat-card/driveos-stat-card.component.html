<article
  class="rounded-[var(--driveos-radius-lg)] border bg-[var(--driveos-surface-card)] p-5 shadow-[var(--driveos-shadow-sm)]"
  [class.border-[var(--driveos-border)]]="state() === 'neutral'"
  [class.border-emerald-200]="state() === 'success'"
  [class.border-amber-200]="state() === 'warning'"
  [class.border-red-200]="state() === 'danger'"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.12em] text-[var(--driveos-text-secondary)]">{{ label() }}</p>
      <p class="mt-2 text-3xl font-black tracking-tight text-[var(--driveos-text-primary)]">{{ value() }}</p>
      @if (hint()) {
        <p class="mt-1 text-xs leading-5 text-[var(--driveos-text-secondary)]">{{ hint() }}</p>
      }
    </div>
    @if (icon()) {
      <span class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-[var(--driveos-surface-subtle)] text-[var(--driveos-primary-800)]">
        <i [class]="icon()" aria-hidden="true"></i>
      </span>
    }
  </div>
</article>
