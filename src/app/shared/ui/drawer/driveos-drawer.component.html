@if (open()) {
  <div class="fixed inset-0 z-50" role="presentation">
    <button
      type="button"
      class="absolute inset-0 bg-slate-950/50 backdrop-blur-sm"
      aria-label="Fermer le panneau"
      [disabled]="closeDisabled()"
      (click)="closeRequested.emit()"
    ></button>

    <aside
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      class="absolute inset-y-0 flex w-full flex-col border-slate-200 bg-white shadow-2xl dark:border-slate-800 dark:bg-slate-900"
      [class.border-l]="side() === 'right'"
      [class.border-r]="side() === 'left'"
      [class]="sideClass() + ' ' + sizeClass()"
    >
      @if (title() || description()) {
        <header class="flex items-start justify-between gap-5 border-b border-slate-200 px-6 py-5 dark:border-slate-800">
          <div class="min-w-0">
            @if (title()) {
              <h2 class="text-xl font-bold tracking-tight text-slate-950 dark:text-white">{{ title() }}</h2>
            }
            @if (description()) {
              <p class="mt-1 text-sm leading-6 text-slate-600 dark:text-slate-300">{{ description() }}</p>
            }
          </div>
          <button
            type="button"
            class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-700 disabled:opacity-40 dark:border-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
            [disabled]="closeDisabled()"
            aria-label="Fermer"
            (click)="closeRequested.emit()"
          >
            <drive-os-icon name="x" size="sm" />
          </button>
        </header>
      }

      <div class="min-h-0 flex-1 overflow-y-auto">
        <ng-content />
      </div>

      <footer class="border-t border-slate-200 bg-slate-50/80 px-6 py-4 dark:border-slate-800 dark:bg-slate-950/30">
        <ng-content select="[driveOsDrawerFooter]" />
      </footer>
    </aside>
  </div>
}
