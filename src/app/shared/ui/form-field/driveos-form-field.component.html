<div class="min-w-0">
  <div class="mb-2 flex items-center gap-2">
    <label
      class="text-sm font-extrabold text-[var(--driveos-text-primary)]"
      [attr.for]="forId() || null"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-[var(--driveos-accent-500)]" aria-hidden="true">*</span>
      }
    </label>

    @if (!required() && optionalLabel()) {
      <span class="rounded-full bg-[var(--driveos-surface-hover)] px-2 py-0.5 text-[11px] font-bold text-[var(--driveos-text-muted)]">
        {{ optionalLabel() }}
      </span>
    }
  </div>

  <ng-content />

  @if (error()) {
    <p class="mt-2 flex items-start gap-2 text-sm font-semibold text-[var(--driveos-danger)]" role="alert">
      <span class="mt-0.5" aria-hidden="true">●</span>
      <span>{{ error() }}</span>
    </p>
  } @else if (hint()) {
    <p class="mt-2 text-sm leading-5 text-[var(--driveos-text-secondary)]">{{ hint() }}</p>
  }
</div>
