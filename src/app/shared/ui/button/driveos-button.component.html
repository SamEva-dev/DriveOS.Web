<button
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  (click)="pressed.emit($event)"
>
  @if (loading()) {
    <i
      class="ph ph-spinner animate-spin"
      aria-hidden="true"
    ></i>
  } @else if (icon()) {
    <i
      [class]="icon()"
      aria-hidden="true"
    ></i>
  }

  <ng-content />
</button>
