<button
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading() ? 'true' : null"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  (click)="pressed.emit($event)"
>
  @if (loading()) {
    <drive-os-icon name="loader-circle" class="animate-spin" />
  } @else if (icon()) {
    <drive-os-icon [name]="icon()!" />
  }
  <ng-content />
</button>
