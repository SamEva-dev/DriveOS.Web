@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" role="presentation">
    <button
      type="button"
      class="absolute inset-0 bg-slate-950/55 backdrop-blur-sm"
      aria-label="Fermer"
      (click)="onBackdrop()"
    ></button>

    <section
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      class="relative z-10 flex max-h-[90vh] w-full flex-col overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-2xl shadow-slate-950/20 dark:border-slate-700 dark:bg-slate-900"
      [class]="panelClass()"
    >
      <header class="flex items-start justify-between gap-5 border-b border-slate-200/80 px-6 py-5 dark:border-slate-800 sm:px-7">
        <div class="min-w-0">
          @if (eyebrow()) {
            <p class="mb-1 text-xs font-bold uppercase tracking-[0.18em] text-orange-600 dark:text-orange-400">{{ eyebrow() }}</p>
          }
          <h2 class="text-xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-2xl">{{ title() }}</h2>
          @if (description()) {
            <p class="mt-2 max-w-3xl text-sm leading-6 text-slate-600 dark:text-slate-300">{{ description() }}</p>
          }
        </div>

        <button
          type="button"
          class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-700 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
          [disabled]="closeDisabled()"
          aria-label="Fermer"
          (click)="closeRequested.emit()"
        >
          <drive-os-icon name="x" size="sm" />
        </button>
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto px-6 py-6 sm:px-7">
        <ng-content />
      </div>

      <footer class="border-t border-slate-200/80 bg-slate-50/80 px-6 py-4 dark:border-slate-800 dark:bg-slate-950/30 sm:px-7">
        <ng-content select="[driveOsModalFooter]" />
      </footer>
    </section>
  </div>
}
