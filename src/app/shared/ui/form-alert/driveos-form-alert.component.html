<div
  class="rounded-[var(--driveos-radius-lg)] border p-4"
  [class.border-blue-200]="tone() === 'info'"
  [class.bg-blue-50]="tone() === 'info'"
  [class.border-amber-200]="tone() === 'warning'"
  [class.bg-amber-50]="tone() === 'warning'"
  [class.border-red-200]="tone() === 'danger'"
  [class.bg-red-50]="tone() === 'danger'"
  [class.border-emerald-200]="tone() === 'success'"
  [class.bg-emerald-50]="tone() === 'success'"
  role="status"
>
  <p
    class="font-extrabold"
    [class.text-blue-900]="tone() === 'info'"
    [class.text-amber-900]="tone() === 'warning'"
    [class.text-red-900]="tone() === 'danger'"
    [class.text-emerald-900]="tone() === 'success'"
  >
    {{ title() }}
  </p>
  @if (message()) {
    <p
      class="mt-1 text-sm leading-5"
      [class.text-blue-800]="tone() === 'info'"
      [class.text-amber-800]="tone() === 'warning'"
      [class.text-red-800]="tone() === 'danger'"
      [class.text-emerald-800]="tone() === 'success'"
    >
      {{ message() }}
    </p>
  }
</div>
