<section
  class="rounded-[var(--driveos-radius-xl)] border bg-[var(--driveos-surface-card)] p-5 shadow-[var(--driveos-shadow-sm)] sm:p-7"
  [class.border-[var(--driveos-border)]]="tone() === 'default'"
  [class.border-blue-200]="tone() === 'primary'"
  [class.border-amber-200]="tone() === 'warning'"
  [class.border-red-200]="tone() === 'danger'"
  [class.border-emerald-200]="tone() === 'success'"
>
  <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div class="flex min-w-0 items-start gap-4">
      @if (step()) {
        <span class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-[var(--driveos-primary-800)] text-base font-black text-white shadow-sm">{{ step() }}</span>
      }
      <div class="min-w-0">
        <h2 class="text-lg font-extrabold text-[var(--driveos-text-primary)] sm:text-xl">{{ title() }}</h2>
        @if (description()) {
          <p class="mt-1 text-sm leading-6 text-[var(--driveos-text-secondary)]">{{ description() }}</p>
        }
      </div>
    </div>
    @if (badge()) {
      <span class="self-start rounded-full bg-[var(--driveos-primary-50)] px-3 py-1 text-xs font-extrabold text-[var(--driveos-primary-800)] dark:bg-slate-800 dark:text-blue-300">{{ badge() }}</span>
    }
  </div>

  <ng-content />
</section>
