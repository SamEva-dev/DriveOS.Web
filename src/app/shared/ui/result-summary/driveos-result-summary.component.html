<div class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300">
  @if (loading()) {
    <span class="size-2 animate-pulse rounded-full bg-blue-500"></span>
    Chargement…
  } @else {
    <span class="flex size-6 items-center justify-center rounded-full bg-blue-50 text-[11px] font-black text-blue-800 dark:bg-blue-950/60 dark:text-blue-300">
      {{ total() }}
    </span>
    <span>{{ label() }}{{ total() > 1 ? 's' : '' }}</span>
    @if (filtered()) {
      <span class="text-orange-600 dark:text-orange-400">filtré(s)</span>
    }
  }
</div>
