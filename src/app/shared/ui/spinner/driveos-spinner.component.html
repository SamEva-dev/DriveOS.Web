<span
      role="status"
      [attr.aria-label]="label()"
      class="inline-flex items-center justify-center"
    >
      <i
        class="
          ph ph-spinner
          animate-spin
          text-blue-800
        "
        [class.text-lg]="size() === 'sm'"
        [class.text-2xl]="size() === 'md'"
        [class.text-4xl]="size() === 'lg'"
        aria-hidden="true"
      ></i>

      <span class="sr-only">
        {{ label() }}
      </span>
    </span>
