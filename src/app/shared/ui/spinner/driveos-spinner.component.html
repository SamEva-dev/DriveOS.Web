<span role="status" [attr.aria-label]="label()" class="inline-flex items-center justify-center text-[var(--driveos-primary-800)]">
  <drive-os-icon
    name="loader-circle"
    class="animate-spin"
    [size]="size() === 'sm' ? 'sm' : size() === 'lg' ? 'xl' : 'lg'"
  />
  <span class="sr-only">{{ label() }}</span>
</span>
