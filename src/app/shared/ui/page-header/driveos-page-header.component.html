<header
  class="rounded-[var(--driveos-radius-xl)] border border-[var(--driveos-border)] bg-[var(--driveos-surface-card)] p-6 shadow-[var(--driveos-shadow-sm)] sm:p-8"
>
  <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
    <div class="min-w-0">
      <ng-content select="[driveosPageBack]" />

      <div class="mt-3 flex items-start gap-4">
        @if (icon()) {
          <div
            class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-[var(--driveos-primary-50)] text-[var(--driveos-primary-800)] dark:bg-slate-800"
          >
            <i
              [class]="icon()"
              aria-hidden="true"
            ></i>
          </div>
        }
        <div class="min-w-0">
          @if (kicker()) {
            <p
              class="mb-1 text-xs font-extrabold uppercase tracking-[0.18em] text-[var(--driveos-text-secondary)]"
            >
              {{ kicker() }}
            </p>
          }
          <div class="flex flex-wrap items-center gap-3">
            <h1
              class="text-2xl font-black tracking-tight text-[var(--driveos-text-primary)] sm:text-3xl"
            >
              {{ title() }}
            </h1>
            @if (badge()) {
              <span
                class="rounded-full bg-[var(--driveos-primary-50)] px-3 py-1 text-xs font-extrabold text-[var(--driveos-primary-800)] dark:bg-slate-800 dark:text-blue-300"
              >
                {{ badge() }}
              </span>
            }
          </div>
          @if (description()) {
            <p
              class="mt-2 max-w-4xl text-sm leading-6 text-[var(--driveos-text-secondary)] sm:text-base"
            >
              {{ description() }}
            </p>
          }
        </div>
      </div>
    </div>

    <div class="flex shrink-0 flex-wrap items-center gap-3">
      <ng-content select="[driveosPageActions]" />
    </div>
  </div>
</header>
