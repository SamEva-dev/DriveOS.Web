<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  <h1 class="text-center text-2xl font-bold text-[var(--driveos-text-primary)]">{{ 'auth.forgot.title' | translate }}</h1>
  <p class="mt-4 text-center text-base leading-7 text-[var(--driveos-text-secondary)]">{{ 'auth.forgot.description' | translate }}</p>
  <form class="mt-8 space-y-5" (ngSubmit)="submit()">
    <div>
      <label class="driveos-auth-label" for="forgot-email">{{ 'auth.fields.email' | translate }}</label>
      <div class="relative">
        <svg class="driveos-auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="forgot-email" name="email" [(ngModel)]="email" type="email" required autocomplete="email" class="driveos-auth-input pl-12" />
      </div>
    </div>
    <button class="driveos-auth-primary" type="submit" [disabled]="loading() || !email">
      {{ loading() ? ('common.actions.loading' | translate) : ('auth.actions.sendResetLink' | translate) }}
    </button>
  </form>
  @if (error()) { <p class="driveos-auth-alert mt-5">{{ error() }}</p> }
  <div class="mt-8"><a routerLink="/login" class="driveos-auth-secondary">{{ 'auth.actions.backToLogin' | translate }}</a></div>
</driveos-auth-shell>
