<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  <h1 class="text-center text-xl font-semibold text-slate-950 dark:text-white">
    {{ 'auth.forgot.title' | translate }}
  </h1>
  <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
    {{ 'auth.forgot.description' | translate }}
  </p>
  <form
    class="mt-6 space-y-4"
    (ngSubmit)="submit()"
  >
    <label
      class="driveos-auth-label"
      for="forgot-email"
    >
      {{ 'auth.fields.email' | translate }}
    </label>
    <div class="relative">
      <i class="ph ph-envelope-simple absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input
        id="forgot-email"
        name="email"
        [(ngModel)]="email"
        type="email"
        required
        class="driveos-auth-input pl-10"
      />
    </div>
    <button
      class="driveos-auth-primary"
      type="submit"
      [disabled]="loading() || !email"
    >
      {{
        loading()
          ? ('common.actions.loading' | translate)
          : ('auth.actions.sendResetLink' | translate)
      }}
    </button>
  </form>
  @if (error()) {
    <p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error() }}</p>
  }
  <a
    routerLink="/login"
    class="mt-5 block text-center text-sm font-medium text-blue-700 hover:underline dark:text-blue-300"
  >
    {{ 'auth.actions.backToLogin' | translate }}
  </a>
</driveos-auth-shell>
