<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  <h1 class="text-center text-2xl font-bold text-[var(--driveos-text-primary)]">
    {{ 'auth.register.title' | translate }}
  </h1>
  <p class="mt-4 text-center text-base leading-7 text-[var(--driveos-text-secondary)]">
    {{ 'auth.register.description' | translate }}
  </p>

  <form
    class="mt-8 space-y-5"
    (ngSubmit)="submit()"
  >
    <div>
      <label
        class="driveos-auth-label"
        for="org"
      >
        {{ 'auth.fields.organization' | translate }}
      </label>
      <div class="relative">
        <svg
          class="driveos-auth-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M4 21V5a2 2 0 0 1 2-2h8v18" />
          <path d="M14 9h4a2 2 0 0 1 2 2v10M8 7h2M8 11h2M8 15h2M17 13h1M17 17h1M2 21h20" />
        </svg>
        <input
          id="org"
          name="organization"
          [(ngModel)]="organizationName"
          required
          class="driveos-auth-input pl-12"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <div>
        <label
          class="driveos-auth-label"
          for="firstName"
        >
          {{ 'auth.fields.firstName' | translate }}
        </label>
        <div class="relative">
          <svg
            class="driveos-auth-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="8"
              r="4"
            />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
          <input
            id="firstName"
            name="firstName"
            [(ngModel)]="firstName"
            required
            autocomplete="given-name"
            class="driveos-auth-input pl-12"
          />
        </div>
      </div>
      <div>
        <label
          class="driveos-auth-label"
          for="lastName"
        >
          {{ 'auth.fields.lastName' | translate }}
        </label>
        <div class="relative">
          <svg
            class="driveos-auth-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="8"
              r="4"
            />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
          <input
            id="lastName"
            name="lastName"
            [(ngModel)]="lastName"
            required
            autocomplete="family-name"
            class="driveos-auth-input pl-12"
          />
        </div>
      </div>
    </div>

    <div>
      <label
        class="driveos-auth-label"
        for="phone"
      >
        {{ 'auth.fields.phone' | translate }}
      </label>
      <div class="relative">
        <svg
          class="driveos-auth-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.7 19.7 0 0 1-8.6-3.1 19.2 19.2 0 0 1-6-6A19.7 19.7 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"
          />
        </svg>
        <input
          id="phone"
          name="phone"
          [(ngModel)]="phone"
          type="tel"
          autocomplete="tel"
          class="driveos-auth-input pl-12"
        />
      </div>
    </div>

    <div>
      <label
        class="driveos-auth-label"
        for="email"
      >
        {{ 'auth.fields.email' | translate }}
      </label>
      <div class="relative">
        <svg
          class="driveos-auth-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          />
          <path d="m3 7 9 6 9-6" />
        </svg>
        <input
          id="email"
          name="email"
          [(ngModel)]="email"
          type="email"
          required
          autocomplete="email"
          class="driveos-auth-input pl-12"
        />
      </div>
    </div>

    <div>
      <label
        class="driveos-auth-label"
        for="password"
      >
        {{ 'auth.fields.password' | translate }}
      </label>
      <div class="relative">
        <svg
          class="driveos-auth-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="10"
            width="16"
            height="11"
            rx="2"
          />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <input
          id="password"
          name="password"
          [(ngModel)]="password"
          [type]="showPassword() ? 'text' : 'password'"
          required
          minlength="8"
          autocomplete="new-password"
          class="driveos-auth-input px-12"
        />
        <button
          type="button"
          class="driveos-auth-icon-button"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="'auth.actions.togglePassword' | translate"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
            <circle
              cx="12"
              cy="12"
              r="3"
            />
          </svg>
        </button>
      </div>
    </div>

    <div>
      <label
        class="driveos-auth-label"
        for="confirmPassword"
      >
        {{ 'auth.fields.confirmPassword' | translate }}
      </label>
      <div class="relative">
        <svg
          class="driveos-auth-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="10"
            width="16"
            height="11"
            rx="2"
          />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <input
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          [type]="showPassword() ? 'text' : 'password'"
          required
          autocomplete="new-password"
          class="driveos-auth-input pl-12"
        />
      </div>
    </div>

    <button
      class="driveos-auth-primary"
      type="submit"
      [disabled]="
        loading() ||
        !organizationName ||
        !firstName ||
        !lastName ||
        !email ||
        !password ||
        password !== confirmPassword
      "
    >
      {{
        loading() ? ('common.actions.loading' | translate) : ('auth.actions.register' | translate)
      }}
    </button>
  </form>

  @if (error()) {
    <p class="driveos-auth-alert mt-5">{{ error() }}</p>
  }

  <div class="mt-8 space-y-5">
    <div class="driveos-auth-divider">ou</div>
    <p class="text-center text-base text-[var(--driveos-text-secondary)]">
      {{ 'auth.register.haveAccount' | translate }}
    </p>
    <a
      routerLink="/login"
      class="driveos-auth-secondary"
    >
      {{ 'auth.actions.login' | translate }}
    </a>
  </div>
</driveos-auth-shell>
