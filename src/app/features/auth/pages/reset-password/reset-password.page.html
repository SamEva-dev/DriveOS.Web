<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  <h1 class="text-center text-xl font-semibold text-slate-950 dark:text-white">
    {{ 'auth.reset.title' | translate }}
  </h1>
  <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
    {{ 'auth.reset.description' | translate }}
  </p>
  <form
    class="mt-6 space-y-4"
    (ngSubmit)="submit()"
  >
    <label
      class="driveos-auth-label"
      for="new-password"
    >
      {{ 'auth.fields.newPassword' | translate }}
    </label>
    <input
      id="new-password"
      name="password"
      [(ngModel)]="password"
      [type]="showPassword() ? 'text' : 'password'"
      required
      minlength="8"
      class="driveos-auth-input"
    />
    <label
      class="driveos-auth-label"
      for="confirm-new-password"
    >
      {{ 'auth.fields.confirmPassword' | translate }}
    </label>
    <input
      id="confirm-new-password"
      name="confirmPassword"
      [(ngModel)]="confirmPassword"
      [type]="showPassword() ? 'text' : 'password'"
      required
      class="driveos-auth-input"
    />
    <label class="flex items-center gap-2 text-sm text-slate-600">
      <input
        type="checkbox"
        [checked]="showPassword()"
        (change)="showPassword.set(!showPassword())"
      />
      {{ 'auth.actions.showPassword' | translate }}
    </label>
    <button
      class="driveos-auth-primary"
      type="submit"
      [disabled]="loading() || !token || !email || !password || password !== confirmPassword"
    >
      {{
        loading()
          ? ('common.actions.loading' | translate)
          : ('auth.actions.resetPassword' | translate)
      }}
    </button>
  </form>
  @if (error()) {
    <p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error() }}</p>
  }
  <a
    routerLink="/login"
    class="mt-5 block text-center text-sm font-medium text-blue-700 hover:underline"
  >
    {{ 'auth.actions.backToLogin' | translate }}
  </a>
</driveos-auth-shell>
