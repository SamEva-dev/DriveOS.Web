<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  <h1 class="text-center text-2xl font-bold text-[var(--driveos-text-primary)]">
    {{ 'auth.reset.title' | translate }}
  </h1>
  <p class="mt-4 text-center text-base leading-7 text-[var(--driveos-text-secondary)]">
    {{ 'auth.reset.description' | translate }}
  </p>
  <form
    class="mt-8 space-y-5"
    (ngSubmit)="submit()"
  >
    <div>
      <label
        class="driveos-auth-label"
        for="new-password"
      >
        {{ 'auth.fields.newPassword' | translate }}
      </label>
      <input
        id="new-password"
        name="password"
        [(ngModel)]="password"
        [type]="showPassword() ? 'text' : 'password'"
        required
        minlength="8"
        autocomplete="new-password"
        class="driveos-auth-input"
      />
    </div>
    <div>
      <label
        class="driveos-auth-label"
        for="confirm-new-password"
      >
        {{ 'auth.fields.confirmPassword' | translate }}
      </label>
      <input
        id="confirm-new-password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        [type]="showPassword() ? 'text' : 'password'"
        required
        autocomplete="new-password"
        class="driveos-auth-input"
      />
    </div>
    <label class="flex items-center gap-2 text-sm text-[var(--driveos-text-secondary)]">
      <input
        type="checkbox"
        [checked]="showPassword()"
        (change)="showPassword.set(!showPassword())"
        class="size-4 accent-[var(--driveos-primary-800)]"
      />
      {{ 'auth.actions.showPassword' | translate }}
    </label>
    <button
      class="driveos-auth-primary"
      type="submit"
      [disabled]="loading() || !token || !email || !password || password !== confirmPassword"
    >
      {{
        loading()
          ? ('common.actions.loading' | translate)
          : ('auth.actions.resetPassword' | translate)
      }}
    </button>
  </form>
  @if (error()) {
    <p class="driveos-auth-alert mt-5">{{ error() }}</p>
  }
  <div class="mt-8">
    <a
      routerLink="/login"
      class="driveos-auth-secondary"
    >
      {{ 'auth.actions.backToLogin' | translate }}
    </a>
  </div>
</driveos-auth-shell>
