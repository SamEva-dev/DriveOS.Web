<driveos-auth-shell [subtitle]="'auth.subtitle' | translate">
  @if (loading()) {
    <div class="py-8 text-center">
      <i class="ph ph-circle-notch animate-spin text-3xl text-blue-800"></i>
      <p class="mt-3 text-sm text-slate-500">{{ 'common.actions.loading' | translate }}</p>
    </div>
  } @else if (success()) {
    <div class="text-center">
      <div
        class="mx-auto flex size-14 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"
      >
        <i class="ph-bold ph-check text-2xl"></i>
      </div>
      <h1 class="mt-5 text-xl font-semibold">{{ 'auth.confirmEmail.success' | translate }}</h1>
      <button
        class="driveos-auth-primary mt-6"
        type="button"
        (click)="goLogin()"
      >
        {{ 'auth.actions.login' | translate }}
      </button>
    </div>
  } @else {
    <div class="text-center">
      <div
        class="mx-auto flex size-14 items-center justify-center rounded-full bg-red-100 text-red-700"
      >
        <i class="ph-bold ph-x text-2xl"></i>
      </div>
      <h1 class="mt-5 text-xl font-semibold">{{ 'auth.confirmEmail.failed' | translate }}</h1>
      <p class="mt-2 text-sm text-red-700">{{ error() }}</p>
      <a
        routerLink="/check-email"
        [queryParams]="{ email: email, type: 'verify' }"
        class="driveos-auth-secondary mt-6"
      >
        {{ 'auth.actions.resend' | translate }}
      </a>
    </div>
  }
</driveos-auth-shell>
