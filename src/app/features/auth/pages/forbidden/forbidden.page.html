<main class="forbidden-page">
  <section class="forbidden-card" aria-labelledby="forbidden-title">
    <div class="forbidden-code">403</div>

    <h1 id="forbidden-title">
      {{ 'auth.forbidden.title' | translate }}
    </h1>

    <p>
      {{ 'auth.forbidden.description' | translate }}
    </p>

    <div class="forbidden-actions">
      <a class="primary-action" [routerLink]="returnUrl()">
        {{ 'auth.forbidden.retry' | translate }}
      </a>

      <a class="secondary-action" routerLink="/organizations">
        {{ 'auth.forbidden.back' | translate }}
      </a>
    </div>
  </section>
</main>
