<section class="driveos-page">
  <div class="driveos-page-header">
    <div>
      <p class="driveos-kicker">{{ 'crm.kicker' | translate }}</p>
      <h1 class="driveos-page-title">{{ 'crm.activities.title' | translate }}</h1>
      <p class="driveos-page-subtitle">{{ 'crm.activities.pageDescription' | translate }}</p>
    </div>
  </div>

  @if (loading()) {
    <div class="flex min-h-72 items-center justify-center"><drive-os-spinner size="lg" /></div>
  } @else {
    <drive-os-card>
      <div class="space-y-3">
        @for (activity of activities(); track activity.id) {
          <button type="button" class="w-full rounded-xl border p-4 text-left transition hover:border-blue-400 dark:border-slate-700" (click)="open(activity)">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <p class="font-semibold text-slate-900 dark:text-white">{{ activity.subject }}</p>
                <p class="mt-1 text-sm text-slate-500">
                  {{ ('crm.activities.types.' + activity.type) | translate }}
                  @if (activity.direction !== 'None') { · {{ ('crm.activities.directions.' + activity.direction) | translate }} }
                </p>
                @if (activity.details) { <p class="mt-2 line-clamp-2 text-sm text-slate-600 dark:text-slate-300">{{ activity.details }}</p> }
              </div>
              <time class="text-xs font-semibold text-slate-500">{{ activity.occurredAtUtc | date:'medium' }}</time>
            </div>
          </button>
        } @empty {
          <p class="rounded-xl border border-dashed p-6 text-center text-sm text-slate-500 dark:border-slate-700">{{ 'crm.activities.empty' | translate }}</p>
        }
      </div>
    </drive-os-card>
  }
</section>
